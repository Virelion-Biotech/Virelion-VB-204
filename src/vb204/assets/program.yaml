  - {study: "Liu et al. 2018", architecture: A, observed_class: high, endpoint: "NHP graft-associated ventricular arrhythmias with mapping", url: "https://doi.org/10.1038/nbt.4162"}
  - {study: "Shiba et al. 2016", architecture: A, observed_class: moderate, endpoint: "VT incidence relative to vehicle controls", url: "https://doi.org/10.1038/nature19815"}
  - {study: "Romagnuolo et al. 2019", architecture: A, observed_class: high, endpoint: "Post-graft ventricular tachyarrhythmias in porcine host", url: "https://doi.org/10.1016/j.stemcr.2019.04.012"}
  - {study: "Jebran et al. 2025", architecture: C, observed_class: low, endpoint: "Epicardial EHM patch; no arrhythmia reported in the described cases", url: "https://doi.org/10.1038/s41586-024-08463-0"}

